name: Build APK (Release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Inject optional config (backend URL / app token)
        run: |
          if [ -n "$BACKEND_URL" ]; then echo "BACKEND_URL=$BACKEND_URL" >> gradle.properties; fi
          if [ -n "$APP_TOKEN" ]; then echo "APP_TOKEN=$APP_TOKEN" >> gradle.properties; fi
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}

      - name: Read app version
        id: ver
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          echo "Building SanChat v$VN"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SanChat-v${{ steps.ver.outputs.version }}.apk"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: SanChat v${{ steps.ver.outputs.version }}
          body: |
            ## SanChat v${{ steps.ver.outputs.version }}

            APK assinado e pronto para instalar (Android 10+).

            **Chat com IA (NVIDIA NIM) via proxy Vercel — a chave da API nunca fica no app.**

            ### Novidades v1.1.0 — redesign completo
            - Visual Dark Premium repaginado: splash com logo, bolhas com gradiente NVIDIA, avatar da IA, cards e hierarquia nova
            - Edge-to-edge de verdade: status bar, barra de navegacao e teclado sem cortes; input acompanha o teclado
            - Seletor de modelos virou bottom sheet bonito; indicador animado enquanto o modelo pensa; caixa de raciocinio com barra verde e chevron
            - Arraste a conversa pro lado pra apagar (com Desfazer), copie mensagens com toque longo, tempo relativo nas conversas
            - Respostas em markdown com blocos de codigo tematizados; transicoes suaves entre telas; layout responsivo (bolhas com largura maxima p/ tablets)

            ### Recursos
            - Streaming de resposta em tempo real
            - 6 modelos pra trocar na hora
            - Multi-conversa com historico (renomear/apagar)
            - Ve o "pensamento" do modelo numa caixa propria, em tempo real
            - Respostas em markdown (codigos, listas, links)
            - Interface bilingue: portugues (padrao) ou ingles
            - Tema dark premium com o verde NVIDIA

            ### Configuracao do proxy (gratuito)
            1. Peca sua chave em build.nvidia.com (gratis)
            2. Importe este repo na Vercel e adicione a env NVIDIA_API_KEY
            3. Cole a URL da Vercel nas Configuracoes do app
            Passo a passo completo no README.
          files: out/SanChat-v${{ steps.ver.outputs.version }}.apk
          make_latest: true
